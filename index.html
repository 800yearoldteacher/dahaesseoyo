}
function timeText(ms) {
  if (!ms) return '';
  const d = Date.now() - ms;
  if (d < 60000) return '방금';
  if (d < 3600000) return Math.floor(d / 60000) + '분 전';
  if (d < 86400000) return Math.floor(d / 3600000) + '시간 전';
  return Math.floor(d / 86400000) + '일 전';
}
/* 오류를 선생님이 알아보기 쉬운 말로 바꿉니다 */
function describeError(err) {
  const code = (err && err.code) || '';
  const map = {
    'permission-denied': '기록장에 들어갈 권한이 없어요. Firebase 보안 규칙이 게시되었는지 확인해 주세요.',
    'unavailable': '인터넷 연결을 확인해 주세요.',
    'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',
    'auth/operation-not-allowed': 'Firebase에서 이 로그인 방법이 꺼져 있어요. 2단계의 로그인 방법 켜기를 확인해 주세요.',
    'auth/admin-restricted-operation': 'Firebase에서 익명 로그인이 꺼져 있어요. 2단계의 로그인 방법 켜기를 확인해 주세요.',
    'auth/unauthorized-domain': '이 주소가 Firebase에 등록되어 있지 않아요. 2단계의 GitHub 주소 허락하기를 확인해 주세요.',
    'auth/popup-blocked': '브라우저가 로그인 창을 막았어요. 주소창 오른쪽에서 팝업을 허용해 주세요.',
    'auth/popup-closed-by-user': '로그인 창이 닫혔어요. 다시 눌러 주세요.',
    'auth/cancelled-popup-request': '로그인 창이 닫혔어요. 다시 눌러 주세요.',
    'auth/operation-not-supported-in-this-environment': '이 파일은 컴퓨터에서 바로 열면 작동하지 않아요. GitHub 주소로 열어 주세요.'
  };
  return map[code] || ('알 수 없는 문제가 생겼어요' + (code ? ' (' + code + ')' : '') + '.');
}

/* 이름 뒤에 '아/야'를 붙여 부르는 말로 만듭니다 (민준아, 지우야) */
function callName(name) {
  const t = name.trim();
  const c = t.charCodeAt(t.length - 1);
  if (c >= 0xac00 && c <= 0xd7a3) return t + ((c - 0xac00) % 28 ? '아' : '야');
  return t;
}


/* 붙여넣은 명단 읽기: '1 민준', '1번 민준', '1. 민준', 엑셀 두 칸(번호, 이름), 이름만 */
function parseRoster(text) {
  const out = [];
  text.split(/\r?\n/).forEach((line) => {
    const raw = line.trim();
    if (!raw) return;
    const cells = raw.split('\t').map((c) => c.trim()).filter(Boolean);
    let no = null, name = '';
    if (cells.length > 1) {
      if (/^\d{1,3}$/.test(cells[0])) { no = +cells[0]; name = cells[1]; } else { name = cells[0]; }
    } else {
      const m = raw.match(/^(\d{1,3})\s*(?:번|\.|\)|,)?\s*(.+)$/);
      if (m) { no = +m[1]; name = m[2]; } else { name = raw; }
    }
    name = name.replace(/\s+/g, ' ').trim().slice(0, 20);
    if (!name || HEADER_WORDS.has(name)) return;
    out.push({ no: no && no > 0 && no < 100 ? no : null, name });
  });
  return out;
}


/* ---------- 소리 (파일 없이 브라우저에서 만듭니다) ---------- */
const Sound = (() => {
  let ctx = null;
  function unlock() {
    try {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
      if (ctx && ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  }
  function tone(freq, at, dur, vol) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(at); o.stop(at + dur + 0.05);
  }
  function play(kind) {
    if (!ctx) return;
    try {
      const t = ctx.currentTime + 0.01;
      if (kind === 'all') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.11, 0.5, 0.22));
      else if (kind === 'undo') { tone(660, t, 0.18, 0.12); tone(494, t + 0.09, 0.24, 0.12); }
      else { tone(880, t, 0.3, 0.22); tone(1318.5, t + 0.1, 0.42, 0.2); }
    } catch (e) { /* 소리가 안 나도 판은 그대로 작동합니다 */ }
  }
  return { unlock, play };
})();

/* ---------- 화면 켜짐 유지 ---------- */
const Wake = (() => {
  let sentinel = null, wanted = false, status = 'off';
  async function request() {
    if (!('wakeLock' in navigator)) { status = 'unsupported'; return; }
    try {
      sentinel = await navigator.wakeLock.request('screen');
      status = 'on';
      sentinel.addEventListener('release', () => { status = 'off'; });
    } catch (e) { status = 'blocked'; }
  }
  document.addEventListener('visibilitychange', () => { if (wanted && document.visibilityState === 'visible') request(); });
  return {
    enable() { wanted = true; if (!sentinel || sentinel.released) request(); },
    status: () => status
  };
})();

/* ---------- 확인 창 ---------- */
function confirmBox(text, okLabel) {
  return new Promise((resolve) => {
    const back = document.getElementById('dlg');
    const ok = back.querySelector('[data-dlg="ok"]');
    back.querySelector('#dlg-text').textContent = text;
    ok.textContent = okLabel || '확인';
    back.classList.add('open');
    ok.focus();
    function finish(v) {
      back.classList.remove('open');
      back.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    function onClick(e) {
      const b = e.target.closest('[data-dlg]');
      if (b) finish(b.dataset.dlg === 'ok');
      else if (e.target === back) finish(false);
    }
    function onKey(e) { if (e.key === 'Escape') finish(false); }
    back.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
  });
}


/* ======================================================
   Firebase 연결
   ====================================================== */
const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);
let db;
try {
  /* 인터넷이 잠깐 끊겨도 기록이 기기에 남았다가 다시 연결되면 보내지도록 합니다 */
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = getFirestore(fbApp);
}
const R = {
  settings: () => doc(db, 'settings', 'main'),
  roster: () => doc(db, 'roster', 'main'),
  boards: () => collection(db, 'boards'),
  board: (id) => doc(db, 'boards', id),
  devices: () => collection(db, 'devices'),
  device: (uid) => doc(db, 'devices', uid)
};

/* ---------- 저장소 ----------
   시제품의 저장소와 똑같은 모양이라, 화면 코드는 그대로 쓰고 저장 위치만 Firebase로 바뀝니다. */
function createCloudStore(role, handlers) {
  handlers = handlers || {};
  const subs = new Set();
  const parts = { settings: undefined, roster: undefined, boards: undefined, devices: role === 'teacher' ? undefined : [] };
  let state = null, unsubs = [], resolveReady;
  const readyP = new Promise((r) => { resolveReady = r; });
  const fail = (err) => { if (handlers.onListenError) handlers.onListenError(err); };
  const act = (p) => Promise.resolve(p).catch((err) => { if (handlers.onWriteError) handlers.onWriteError(err); });

  function compose(meta) {
    if (parts.settings === undefined || parts.roster === undefined || parts.boards === undefined || parts.devices === undefined) return;
    const items = parts.roster && Array.isArray(parts.roster.items) ? parts.roster.items : [];
    const students = items.filter((x) => x && x.id && x.name).map((x) => ({ id: String(x.id), no: Number(x.no) || 0, name: String(x.name) }));
    students.sort((a, b) => (a.no - b.no) || a.name.localeCompare(b.name, 'ko'));
    const boards = parts.boards.map((b) => ({
      id: b.id, title: String(b.title || ''), createdAt: Number(b.createdAt) || 0,
      archived: !!b.archived, shown: !!b.shown, done: b.done && typeof b.done === 'object' ? b.done : {}
    }));
    boards.sort((a, b) => b.createdAt - a.createdAt);
    const show = boards.filter((b) => b.shown && !b.archived).map((b) => b.id);
    const settings = Object.assign({}, DEFAULT_SETTINGS, parts.settings || {});
    const first = !state;
    state = { students, boards, show, settings, devices: parts.devices };
    const m = first ? { initial: true } : (meta || {});
    subs.forEach((cb) => cb(state, m));
    if (first) resolveReady(state);
  }

  function start() {
    unsubs.push(onSnapshot(R.settings(), (snap) => { parts.settings = snap.exists() ? snap.data() : null; compose({ type: 'settings' }); }, fail));
    unsubs.push(onSnapshot(R.roster(), (snap) => { parts.roster = snap.exists() ? snap.data() : null; compose({ type: 'roster' }); }, fail));
    unsubs.push(onSnapshot(R.boards(), (qs) => {
      const prev = parts.boards;
      const next = qs.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      let meta = { type: 'boards' };
      if (prev) {
        /* 다른 기기에서 한 명의 완료·취소가 들어오면 교사 화면에서 그 이름을 잠깐 표시합니다 */
        qs.docChanges().forEach((ch) => {
          if (ch.type !== 'modified') return;
          const before = prev.find((x) => x.id === ch.doc.id);
          if (!before) return;
          const bd = before.done || {}, ad = ch.doc.data().done || {};
          const added = Object.keys(ad).filter((k) => ad[k] && !bd[k]);
          const removed = Object.keys(bd).filter((k) => bd[k] && !ad[k]);
          const by = ch.doc.metadata.hasPendingWrites ? 'local' : 'tablet';
          if (added.length === 1 && !removed.length) meta = { type: 'done', bid: ch.doc.id, sid: added[0], by };
          else if (removed.length === 1 && !added.length) meta = { type: 'undo', bid: ch.doc.id, sid: removed[0], by };
        });
      }
      parts.boards = next;
      compose(meta);
    }, fail));
    if (role === 'teacher') {
      unsubs.push(onSnapshot(R.devices(), (qs) => { parts.devices = qs.docs.map((d) => Object.assign({ id: d.id }, d.data())); compose({ type: 'devices' }); }, fail));
    }
    return readyP;
  }
  function stop() {
    unsubs.forEach((u) => { try { u(); } catch (e) { /* 무시 */ } });
    unsubs = [];
    subs.clear();
  }

  const cur = () => state || { students: [], boards: [], show: [], settings: Object.assign({}, DEFAULT_SETTINGS), devices: [] };
  const clean = (list) => list.map((x) => ({ id: x.id, no: x.no, name: x.name }));
  const saveRoster = (items) => act(setDoc(R.roster(), { items: clean(items), updatedAt: Date.now() }));

  return {
    get: () => state,
    start,
    stop,
    subscribe(cb) { subs.add(cb); if (state) cb(state, { initial: true }); return () => subs.delete(cb); },
    /* 판 */
    markDone(bid, sid) { return act(updateDoc(R.board(bid), new FieldPath('done', sid), Date.now())); },
    unmark(bid, sid) { return act(updateDoc(R.board(bid), new FieldPath('done', sid), deleteField())); },
    addBoard(title, show) {
      const ref = doc(R.boards());
      act(setDoc(ref, { title, createdAt: Date.now(), archived: false, shown: !!show, done: {} }));
      return ref.id;
    },
    renameBoard(id, title) { act(updateDoc(R.board(id), { title })); },
    resetBoard(id) { act(updateDoc(R.board(id), { done: {} })); },
    archiveBoard(id, flag) { act(updateDoc(R.board(id), flag ? { archived: true, shown: false } : { archived: false })); },
    deleteBoard(id) { act(deleteDoc(R.board(id))); },
    toggleShow(id) {
      const b = cur().boards.find((x) => x.id === id);
      if (!b) return 'none';
      act(updateDoc(R.board(id), { shown: !b.shown }));
      return b.shown ? 'hidden' : 'shown';
    },
    /* 명단 */
    addStudents(list) {
      const items = cur().students.map((x) => Object.assign({}, x));
      let max = items.reduce((m, x) => Math.max(m, x.no), 0);
      list.forEach((e) => {
        const taken = e.no && items.some((x) => x.no === e.no);
        const no = e.no && !taken ? e.no : ++max;
        if (no > max) max = no;
        items.push({ id: rid('s'), no, name: e.name });
      });
      saveRoster(items);
    },
    replaceStudents(list) {
      let max = list.reduce((m, e) => Math.max(m, e.no || 0), 0);
      const used = new Set();
      const items = list.map((e) => {
        let no = e.no;
        if (!no || used.has(no)) no = ++max;
        used.add(no);
        return { id: rid('s'), no, name: e.name };
      });
      const batch = writeBatch(db);
      batch.set(R.roster(), { items: clean(items), updatedAt: Date.now() });
      cur().boards.forEach((b) => { if (Object.keys(b.done).length) batch.update(R.board(b.id), { done: {} }); });
      act(batch.commit());
    },
    updateStudent(id, patch) { saveRoster(cur().students.map((x) => (x.id === id ? Object.assign({}, x, patch) : x))); },
    removeStudent(id) {
      const batch = writeBatch(db);
      batch.set(R.roster(), { items: clean(cur().students.filter((x) => x.id !== id)), updatedAt: Date.now() });
      cur().boards.forEach((b) => { if (b.done[id]) batch.update(R.board(b.id), new FieldPath('done', id), deleteField()); });
      act(batch.commit());
    },
    renumber() { saveRoster(cur().students.map((x, i) => Object.assign({}, x, { no: i + 1 }))); },
    /* 설정과 태블릿 */
    setSetting(k, v) { act(updateDoc(R.settings(), { [k]: v })); },
    reloadTablets() { act(updateDoc(R.settings(), { reloadSeq: increment(1) })); },
    approveDevice(uid) { act(updateDoc(R.device(uid), { approved: true })); },
    removeDevice(uid) { act(deleteDoc(R.device(uid))); }
  };
}

/* ======================================================
   학생용 판 (교실 앞 태블릿)
   ====================================================== */
function BoardView(root, store, ctx) {
  const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  root.innerHTML =
    '<div class="board-top"><span class="date"></span><div class="page-dots" aria-hidden="true"></div>' +
    '<button type="button" class="gear" aria-label="태블릿 설정 열기, 잠금번호가 필요해요">' + GEAR + '</button></div>' +
    '<span class="sr page-live" aria-live="polite"></span>' +
    '<div class="cols"></div>' +
    '<div class="tray">' +
    '<button type="button" class="nav prev" hidden aria-label="이전 판 보기">' + ARROW_L + '<span>이전</span></button>' +
    '<span class="tray-msg idle" aria-live="polite"></span>' +
    '<button type="button" class="nav next" hidden aria-label="다음 판 보기"><span>다음</span>' + ARROW_R + '</button>' +
    '</div>' +
    '<div class="net" role="status" hidden></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="태블릿 설정"><div class="sheet-box"></div></div>';

  const $ = (q) => root.querySelector(q);
  const colsEl = $('.cols'), msgEl = $('.tray-msg'), sheet = $('.sheet'), box = $('.sheet-box'), dateEl = $('.date'), gear = $('.gear');
  const dotsEl = $('.page-dots'), liveEl = $('.page-live'), prevBtn = $('.nav.prev'), nextBtn = $('.nav.next'), netEl = $('.net');
  const cols = new Map();
  const guard = new Map();
  let sayTimer = 0;
  let page = 0, perPage = PER_PAGE_WIDE, pages = 1;
  let lastState = null, prevShown = null;

  const idleHTML = () => (store.get().settings.selfCancel
    ? '다 했으면 내 번호를 눌러요<span class="sub">잘못 눌렀으면 한 번 더 눌러요</span>'
    : '다 했으면 내 번호를 눌러요');
  msgEl.innerHTML = idleHTML();

  function tickDate() {
    try { dateEl.textContent = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }).format(new Date()); }
    catch (e) { dateEl.textContent = ''; }
  }
  tickDate();
  const dateTimer = setInterval(tickDate, 60000);

  /* 카드가 스크롤 없이 한 화면에 가장 크게 들어가도록 줄 수를 고릅니다 */
  function fit(c) {
    const colW = c.el.clientWidth;
    if (colW) {
      const colH = c.el.clientHeight;
      /* 제목은 칸 너비와 높이에 맞춰 최대한 크게 (가로 3칸 약 32px, 세로 1칸 52px) */
      const t = Math.round(Math.max(22, Math.min(colW * 0.09, colH * 0.075, 52)));
      c.el.style.setProperty('--title-size', t + 'px');
      c.el.style.setProperty('--count-size', Math.round(Math.max(15, Math.min(t * 0.6, 26))) + 'px');
      c.el.style.setProperty('--big', Math.round(Math.max(120, Math.min(colW * 0.62, colH * 0.55, 320))) + 'px');
    }
    const g = c.grid, W = g.clientWidth, H = g.clientHeight, n = c.n;
    if (!W || !H || !n) return;
    const gap = Math.round(Math.max(6, Math.min(14, Math.min(W, H) * 0.018)));
    let best = null;
    for (let k = 1; k <= n; k++) {
      const rows = Math.ceil(n / k);
      const cw = (W - gap * (k - 1)) / k;
      const ch = (H - gap * (rows - 1)) / rows;
      if (cw <= 0 || ch <= 0) continue;
      const size = Math.min(cw, ch * 1.2);
      if (!best || size > best.size + 0.01) best = { size, k, cw, ch };
    }
    if (!best) return;
    const cardH = Math.max(34, Math.min(best.ch, best.cw * 1.05));
    const base = Math.min(cardH, best.cw);
    const st = g.style;
    st.setProperty('--cols', best.k);
    st.setProperty('--gap', gap + 'px');
    st.setProperty('--card-h', Math.floor(cardH) + 'px');
    st.setProperty('--no-size', Math.round(base * 0.42) + 'px');
    st.setProperty('--nm-size', Math.round(Math.min(base * 0.21, best.cw / 3.4)) + 'px');
    st.setProperty('--stamp-size', Math.round(base * 0.42) + 'px');
  }

  function ensureCol(bid) {
    let c = cols.get(bid);
    if (c) return c;
    const el = document.createElement('section');
    el.className = 'col';
    el.innerHTML = '<div class="col-head"><h2 class="col-title"></h2>' +
      '<div class="col-meta"><div class="col-bar"><i></i></div><div class="col-count"></div></div></div>' +
      '<div class="grid" role="group"></div>' +
      '<div class="big-stamp" aria-hidden="true"><span class="l1">모두</span><span class="l2">다 했어요!</span></div>';
    c = {
      el, bid, n: 0, all: undefined, cards: new Map(),
      title: el.querySelector('.col-title'), count: el.querySelector('.col-count'),
      bar: el.querySelector('.col-bar i'), grid: el.querySelector('.grid'), big: el.querySelector('.big-stamp')
    };
    c.grid.addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) onTap(bid, b.dataset.sid); });
    if ('ResizeObserver' in window) { c.ro = new ResizeObserver(() => fit(c)); c.ro.observe(c.grid); }
    cols.set(bid, c);
    return c;
  }
  function dropCol(bid) {
    const c = cols.get(bid);
    if (!c) return;
    if (c.ro) c.ro.disconnect();
    clearTimeout(c.bigTimer);
    c.el.remove();
    cols.delete(bid);
  }
  function celebrate(c) {
    c.big.classList.remove('show'); void c.big.offsetWidth; c.big.classList.add('show');
    clearTimeout(c.bigTimer);
    c.bigTimer = setTimeout(() => c.big.classList.remove('show'), 3300);
  }

  function updateCol(c, b, s, meta) {
    c.title.textContent = b.title;
    const total = s.students.length;
    const done = doneCount(b, s);
    c.count.innerHTML = '<b>' + done + '</b> / ' + total + '명';
    c.bar.style.width = pct(done, total) + '%';
    c.grid.setAttribute('aria-label', b.title);
    const seen = new Set();
    s.students.forEach((st, i) => {
      seen.add(st.id);
      let el = c.cards.get(st.id);
      const isNew = !el;
      if (isNew) {
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'card';
        el.dataset.sid = st.id;
        el.innerHTML = '<span class="no"></span><span class="nm"></span><span class="stamp" aria-hidden="true">다했<br>어요</span>';
        el.addEventListener('animationend', (ev) => { if (ev.animationName === 'stampIn') el.classList.remove('pop'); });
        c.cards.set(st.id, el);
      }
      if (c.grid.children[i] !== el) c.grid.insertBefore(el, c.grid.children[i] || null);
      const on = !!b.done[st.id];
      const was = el.classList.contains('done');
      el.children[0].textContent = st.no;
      el.children[1].textContent = st.name;
      el.classList.toggle('done', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
      el.setAttribute('aria-label', st.no + '번 ' + st.name + (on ? (s.settings.selfCancel ? ', 다 했어요, 다시 누르면 취소돼요' : ', 다 했어요') : ', 아직'));
      if (on && !was && !isNew && !meta.initial) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    });
    c.cards.forEach((el, sid) => { if (!seen.has(sid)) { el.remove(); c.cards.delete(sid); } });
    if (c.n !== total) { c.n = total; fit(c); }
    const all = total > 0 && done === total;
    if (all && c.all === false && !meta.initial) celebrate(c);
    c.all = all;
  }

  /* 쪽 나누기: 가로 화면은 3개씩, 세로 화면은 1개씩 보여 줍니다 */
  function calcPerPage() {
    const w = root.clientWidth, h = root.clientHeight;
    if (!w || !h) return perPage;
    return h > w ? 1 : PER_PAGE_WIDE;
  }
  function paintPager(total) {
    const multi = pages > 1;
    prevBtn.hidden = !multi;
    nextBtn.hidden = !multi;
    dotsEl.innerHTML = multi ? Array.from({ length: pages }, (_, i) => '<i' + (i === page ? ' class="on"' : '') + '></i>').join('') : '';
    const from = page * perPage + 1, to = Math.min(total, (page + 1) * perPage);
    liveEl.textContent = multi ? '판 ' + total + '개 중 ' + (from === to ? from : from + '~' + to) + '번째를 보고 있어요' : '';
  }

  function render(s, meta) {
    lastState = s;
    const showSet = new Set(s.show);
    const list = s.boards.filter((b) => !b.archived && showSet.has(b.id));   /* 교사 화면 목록 순서(새 판이 앞) */
    if (prevShown && !meta.initial) {
      const idx = list.findIndex((b) => !prevShown.has(b.id));
      if (idx >= 0) page = Math.floor(idx / perPage);   /* 선생님이 새로 띄운 판이 있는 쪽으로 이동 */
    }
    prevShown = new Set(list.map((b) => b.id));
    pages = Math.max(1, Math.ceil(list.length / perPage));
    page = Math.min(Math.max(page, 0), pages - 1);
    paintPager(list.length);
    if (msgEl.classList.contains('idle')) msgEl.innerHTML = idleHTML();
    const shown = list.slice(page * perPage, (page + 1) * perPage);
    const empty = !s.students.length ? '학생 명단이 비어 있어요.<br>교사 화면의 학생 명단에서 넣어 주세요.'
      : !shown.length ? '지금은 보여 줄 판이 없어요.<br>교사 화면에서 ‘태블릿에 표시’를 눌러 주세요.' : '';
    if (empty) {
      Array.from(cols.keys()).forEach(dropCol);
      colsEl.innerHTML = '<div class="empty">' + empty + '</div>';
      return;
    }
    const e = colsEl.querySelector('.empty');
    if (e) e.remove();
    Array.from(cols.keys()).forEach((bid) => { if (!shown.some((b) => b.id === bid)) dropCol(bid); });
    shown.forEach((b, i) => {
      const c = ensureCol(b.id);
      if (colsEl.children[i] !== c.el) colsEl.insertBefore(c.el, colsEl.children[i] || null);
      updateCol(c, b, s, meta);
    });
  }

  function goPage(d) {
    if (pages <= 1 || !lastState) return;
    page = (page + d + pages) % pages;   /* 끝에서 누르면 처음으로 돌아갑니다 */
    colsEl.classList.remove('turn'); void colsEl.offsetWidth; colsEl.classList.add('turn');
    render(lastState, { paging: true });
  }
  prevBtn.addEventListener('click', () => goPage(-1));
  nextBtn.addEventListener('click', () => goPage(1));
  colsEl.addEventListener('animationend', (e) => { if (e.animationName === 'turnIn') colsEl.classList.remove('turn'); });

  function onResize() {
    const w = root.clientWidth, h = root.clientHeight;
    if (w && h) root.style.setProperty('--u', (Math.min(w, h * 1.4) / 100).toFixed(2) + 'px');
    const np = calcPerPage();
    if (np !== perPage) {
      const first = page * perPage;
      perPage = np;
      page = Math.floor(first / perPage);
      if (lastState) render(lastState, { paging: true });
    }
    cols.forEach(fit);
  }

  /* 메시지 칸(칠판 아래 분필 받침대) */
  function say(text) {
    msgEl.textContent = text;
    msgEl.classList.remove('idle');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(idle, 3000);
  }
  function idle() {
    msgEl.innerHTML = idleHTML();
    msgEl.classList.add('idle');
  }

  /* 누르면 완료, 다 한 카드를 다시 누르면 취소 */
  function onTap(bid, sid) {
    Sound.unlock();
    Wake.enable();
    const key = bid + '|' + sid;
    const now = Date.now();
    if ((guard.get(key) || 0) > now) return;   /* 방금 바뀐 카드를 곧바로 또 누른 것은 무시합니다 */
    const s = store.get();
    const b = s.boards.find((x) => x.id === bid);
    const st = s.students.find((x) => x.id === sid);
    if (!b || !st) return;
    if (b.done[sid]) {
      if (!s.settings.selfCancel) { say('이미 다 했어요. 바꾸려면 선생님께 말해요.'); return; }
      guard.set(key, now + GUARD_MS);
      store.unmark(bid, sid, 'tablet');
      if (s.settings.sound) Sound.play('undo');
      say(st.no + '번 ' + st.name + ', 취소했어요');
      return;
    }
    const allDone = s.students.every((x) => x.id === sid || b.done[x.id]);   /* 저장 전에 미리 셉니다 */
    guard.set(key, now + GUARD_MS);
    store.markDone(bid, sid, 'tablet');
    if (s.settings.sound) Sound.play(allDone ? 'all' : 'done');
    say(allDone ? '모두 다 했어요! 다 같이 박수!'
      : s.settings.praise ? callName(st.name) + ', 잘했어요!' : st.no + '번 ' + st.name + ', 다 했어요');
  }

  /* 선생님 전용 설정: 잠금번호 */
  let pin = '';
  function paintDots() { box.querySelectorAll('.dots span').forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
  function openPin() {
    pin = '';
    box.innerHTML = '<h3>선생님 확인</h3><p class="pin-help">잠금번호 4자리를 눌러 주세요</p>' +
      '<div class="dots"><span></span><span></span><span></span><span></span></div><div class="keys">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => '<button type="button" data-key="' + n + '">' + n + '</button>').join('') +
      '<button type="button" class="k-sub" data-key="close">닫기</button><button type="button" data-key="0">0</button><button type="button" class="k-sub" data-key="back">지움</button></div>';
    sheet.classList.add('open');
    const first = box.querySelector('[data-key="1"]');
    if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() {
    sheet.classList.remove('open');
    box.innerHTML = '';
    pin = '';
    gear.focus({ preventScroll: true });
  }
  function wakeText(st) {
    return ({
      on: '켜져 있어요',
      off: '학생이 카드를 처음 누르면 켜져요',
      unsupported: '이 브라우저는 지원하지 않아요. 기기의 자동 잠금을 꺼 주세요',
      blocked: '지금 환경에서는 막혀 있어요. 기기의 자동 잠금을 꺼 주세요'
    })[st] || '';
  }
  function openMenu() {
    const s = store.get().settings;
    const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    box.innerHTML = '<h3>태블릿 설정</h3><p>학생 화면에는 보이지 않는 메뉴예요</p><div class="menu-list">' +
      '<div class="menu-row"><span>효과음<small>카드를 누를 때 나는 소리</small></span><button type="button" class="pill" data-menu="sound" aria-pressed="' + (s.sound ? 'true' : 'false') + '">' + (s.sound ? '켜짐' : '꺼짐') + '</button></div>' +
      (fsOK ? '<div class="menu-row"><span>전체 화면<small>주소창과 메뉴를 숨겨요</small></span><button type="button" class="pill" data-menu="fs">바꾸기</button></div>' : '') +
      '<div class="menu-row"><span>화면 켜짐 유지<small>' + wakeText(Wake.status()) + '</small></span></div>' +
      '<div class="menu-row"><span>이 기기<small>' + esc(ctx.deviceText()) + '</small></span></div>' +
      '<div class="menu-row"><span>화면 버전<small>' + esc(APP_VERSION) + '</small></span></div>' +
      '</div><button type="button" class="sheet-close" data-key="close">닫기</button>';
    const first = box.querySelector('[data-menu]');
    if (first) first.focus({ preventScroll: true });
  }
  function toggleFs() {
    try {
      const d = document, el = d.documentElement;
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
    } catch (e) { /* 지원하지 않는 환경 */ }
  }
  function press(k) {
    if (k === 'close') { closeSheet(); return; }
    if (k === 'back') pin = pin.slice(0, -1);
    else if (/^\d$/.test(k) && pin.length < 4) pin += k;
    paintDots();
    if (pin.length < 4) return;
    if (pin === store.get().settings.pin) { openMenu(); return; }
    const dots = box.querySelector('.dots');
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    box.querySelector('.pin-help').textContent = '잠금번호가 달라요. 다시 눌러 주세요';
    pin = '';
    setTimeout(paintDots, 300);
  }
  box.addEventListener('click', (e) => {
    const k = e.target.closest('[data-key]');
    if (k) { press(k.dataset.key); return; }
    const m = e.target.closest('[data-menu]');
    if (!m) return;
    if (m.dataset.menu === 'sound') { store.setSetting('sound', !store.get().settings.sound); openMenu(); }
    else if (m.dataset.menu === 'fs') toggleFs();
  });
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
  root.addEventListener('keydown', (e) => {
    if (sheet.classList.contains('open')) {
      const inPin = !!box.querySelector('.dots');
      if (e.key === 'Escape') closeSheet();
      else if (inPin && /^\d$/.test(e.key)) { e.preventDefault(); press(e.key); }
      else if (inPin && e.key === 'Backspace') { e.preventDefault(); press('back'); }
      return;
    }
    if (e.key === 'ArrowLeft') goPage(-1);
    else if (e.key === 'ArrowRight') goPage(1);
  });
  gear.addEventListener('click', openPin);

  perPage = calcPerPage();
  const unsubscribe = store.subscribe(render);
  onResize();
  const rootRO = 'ResizeObserver' in window ? new ResizeObserver(onResize) : null;
  if (rootRO) rootRO.observe(root);
  window.addEventListener('resize', onResize);
  return {
    refit: onResize,
    say,
    setNet(text) { netEl.textContent = text || ''; netEl.hidden = !text; },
    menuOpen: () => sheet.classList.contains('open'),
    destroy() {
      unsubscribe();
      clearInterval(dateTimer);
      clearTimeout(sayTimer);
      if (rootRO) rootRO.disconnect();
      window.removeEventListener('resize', onResize);
      Array.from(cols.keys()).forEach(dropCol);
    }
  };
}

/* ======================================================
   교사 화면 (선생님 PC)
   ====================================================== */
function TeacherView(root, store, ctx) {
  let sel = null, pendingSel = null;
  let knownPending = null;
  let rosterEditing = false, rosterPending = false;
  let titleEditing = false;

  root.innerHTML = `
  <div class="tv-inner">
    <div class="tv-head">
      <h1>교사 화면</h1>
      <div class="acct"><span class="status on" id="tv-net">실시간 연결됨</span><span id="tv-email"></span><button type="button" class="btn sm" data-act="logout">로그아웃</button></div>
    </div>
    <div class="update" id="tv-update" hidden><span>새 버전이 올라왔어요. 새로고침하면 적용돼요.</span><button type="button" class="btn sm" data-act="reload-self">새로고침</button></div>
    <div class="tabs" role="tablist" aria-label="교사 메뉴">
      <button type="button" role="tab" data-tab="boards" aria-selected="true">판 관리</button>
      <button type="button" role="tab" data-tab="roster" aria-selected="false">학생 명단</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false">태블릿 설정<span class="badge" id="tv-badge" hidden></span></button>
    </div>
    <p class="flash" id="tv-flash" role="status" hidden></p>

    <div class="tab-panel" data-panel="boards" role="tabpanel">
      <div class="boards-layout">
        <div class="bcol">
          <div class="newb">
            <input class="input" id="tv-new-title" maxlength="40" autocomplete="off" placeholder="새 판 이름 (예: 수학 익힘책 36쪽)" aria-label="새 판 이름">
            <button type="button" class="btn primary" data-act="new">만들기</button>
          </div>
          <div class="quick">${QUICK.map((q) => `<button type="button" data-quick="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          <label class="check"><input type="checkbox" id="tv-autoshow" checked> 만들면 바로 태블릿에 표시</label>
          <p class="list-h">진행 중인 판</p>
          <ul class="blist" id="tv-blist"></ul>
          <p class="hint">태블릿에는 이 목록 순서대로 가로 화면에서 3개씩, 세로 화면에서 1개씩 보여요. 더 많으면 학생이 화살표로 넘겨요.</p>
          <details class="archive"><summary id="tv-asum">보관함</summary><div id="tv-alist"></div></details>
        </div>
        <div class="detail" id="tv-detail"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="roster" role="tabpanel" hidden>
      <p class="lead">번호 순서대로 태블릿에 카드가 놓여요. 개인정보 보호를 위해 성은 빼고 이름만 적기를 권해요. <span class="count" id="tv-rcount"></span></p>
      <div class="row addrow">
        <input class="input no-in" id="tv-add-no" type="number" min="1" max="99" inputmode="numeric" placeholder="번호" aria-label="추가할 학생 번호, 비우면 자동으로 붙어요">
        <input class="input" id="tv-add-name" maxlength="20" autocomplete="off" placeholder="이름" aria-label="추가할 학생 이름">
        <button type="button" class="btn primary" data-act="add-one">추가</button>
      </div>
      <table class="roster">
        <thead><tr><th scope="col">번호</th><th scope="col">이름</th><th scope="col"><span class="sr">명단에서 빼기</span></th></tr></thead>
        <tbody id="tv-roster-body"></tbody>
      </table>
      <div class="row"><button type="button" class="btn" data-act="renumber">번호 1번부터 다시 매기기</button></div>
      <details class="bulk">
        <summary>엑셀이나 메모장에서 한꺼번에 붙여넣기</summary>
        <p class="hint">한 줄에 한 명씩 적어요. ‘1 민준’처럼 번호를 함께 적어도 되고, 엑셀의 번호와 이름 두 칸을 그대로 복사해도 돼요.</p>
        <textarea id="tv-bulk" placeholder="1 민준&#10;2 서연&#10;3 도윤" aria-label="붙여넣을 명단"></textarea>
        <p class="hint" id="tv-bulk-preview"></p>
        <div class="row">
          <button type="button" class="btn" data-act="bulk-add">뒤에 추가하기</button>
          <button type="button" class="btn" data-act="bulk-replace">명단 새로 바꾸기</button>
          <span class="msg" id="tv-bulk-msg" role="status"></span>
        </div>
      </details>
    </div>

    <div class="tab-panel" data-panel="settings" role="tabpanel" hidden>
      <section class="set">
        <h3>태블릿 연결</h3>
        <p>태블릿에서 다했어요판 주소를 열면 네 자리 번호가 나타나요. 같은 번호를 여기서 승인하면 그 태블릿에 판이 열려요.</p>
        <div id="tv-devices"></div>
      </section>
      <section class="set">
        <h3>태블릿 잠금번호</h3>
        <p>태블릿 오른쪽 위의 설정 단추를 누르면 이 번호를 물어요. 처음 번호는 1234이니 꼭 바꿔 주세요.</p>
        <div class="pinrow">
          <input class="input pin-in" id="tv-pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="새 번호" aria-label="새 잠금번호 4자리">
          <button type="button" class="btn" data-act="save-pin">바꾸기</button>
          <span class="msg" id="tv-pin-msg" role="status"></span>
        </div>
      </section>
      <section class="set">
        <h3>효과음</h3>
        <p>학생이 카드를 누를 때 짧은 소리를 내요.</p>
        <div class="opts"><button type="button" data-act="sound" data-v="1">켜기</button><button type="button" data-act="sound" data-v="0">끄기</button></div>
      </section>
      <section class="set">
        <h3>학생이 다시 눌러 취소하기</h3>
        <p>다 한 카드를 한 번 더 누르면 ‘아직’으로 돌아가요. 빠르게 두 번 눌러 곧바로 취소되는 일을 막으려고, 누른 뒤 1초 동안은 같은 카드를 다시 눌러도 반응하지 않아요. 막기로 두면 선생님만 바꿀 수 있어요.</p>
        <div class="opts"><button type="button" data-act="self-cancel" data-v="1">허용</button><button type="button" data-act="self-cancel" data-v="0">막기</button></div>
      </section>
      <section class="set">
        <h3>칭찬 문구</h3>
        <p>누른 학생의 이름을 불러 ‘민준아, 잘했어요!’처럼 보여 줘요. 끄면 ‘1번 민준, 다 했어요’로 짧게 알려요.</p>
        <div class="opts"><button type="button" data-act="praise" data-v="1">보이기</button><button type="button" data-act="praise" data-v="0">숨기기</button></div>
      </section>
      <section class="set last">
        <h3>태블릿 새로고침</h3>
        <p>화면 파일을 새로 올린 뒤 누르면, 연결된 태블릿이 곧바로 새 화면을 불러와요. 태블릿은 몇 분마다 새 버전을 스스로 확인하기도 해요.</p>
        <div class="row" style="margin-top:0"><button type="button" class="btn" data-act="reload-tablets">태블릿 새로고침</button><span class="msg" id="tv-reload-msg" role="status"></span></div>
        <p class="ver">화면 버전 ${APP_VERSION}</p>
      </section>
    </div>
  </div>`;

  const $ = (q) => root.querySelector(q);
  const blist = $('#tv-blist'), detailEl = $('#tv-detail'), tbody = $('#tv-roster-body');

  function setTab(t) {
    root.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    root.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== t; });
  }
  function flash(text) {
    const f = $('#tv-flash');
    f.textContent = text;
    f.hidden = false;
    clearTimeout(flash.t);
    flash.t = setTimeout(() => { f.hidden = true; }, 4000);
  }
  function note(q, text, isErr) {
    const el = $(q);
    el.textContent = text;
    el.classList.toggle('err', !!isErr);
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; }, 4000);
  }
  function keepFocus(container, fn) {
    const a = document.activeElement;
    let q = null;
    if (a && container.contains(a) && a.dataset && a.dataset.act) q = '[data-act="' + a.dataset.act + '"]' + (a.dataset.id ? '[data-id="' + a.dataset.id + '"]' : '');
    fn();
    if (q) { const n = container.querySelector(q); if (n) n.focus({ preventScroll: true }); }
  }

  /* --- 판 목록 --- */
  function renderBoards(s, meta) {
    const active = s.boards.filter((b) => !b.archived);
    const archived = s.boards.filter((b) => b.archived);
    if (pendingSel && active.some((b) => b.id === pendingSel)) { sel = pendingSel; pendingSel = null; }
    if (!sel || !active.some((b) => b.id === sel)) sel = s.show.find((id) => active.some((b) => b.id === id)) || (active[0] ? active[0].id : null);
    const total = s.students.length;
    keepFocus(blist, () => {
      blist.innerHTML = active.length ? active.map((b) => {
        const d = doneCount(b, s);
        const on = s.show.includes(b.id);
        return '<li class="bitem' + (b.id === sel ? ' sel' : '') + '">' +
          '<button type="button" class="bsel" data-act="select" data-id="' + b.id + '"' + (b.id === sel ? ' aria-current="true"' : '') + '>' +
          '<span class="t"><span>' + esc(b.title) + '</span><span class="c">' + d + '/' + total + '</span></span>' +
          '<span class="mini"><i style="width:' + pct(d, total) + '%"></i></span></button>' +
          '<div class="bfoot"><button type="button" class="showbtn' + (on ? ' on' : '') + '" data-act="show" data-id="' + b.id + '" aria-pressed="' + on + '">' + (on ? '태블릿에 표시 중' : '태블릿에 표시') + '</button></div></li>';
      }).join('') : '<li class="none">진행 중인 판이 없어요. 위에서 새 판을 만들어 주세요.</li>';
    });
    $('#tv-asum').textContent = '보관함 (' + archived.length + ')';
    $('#tv-alist').innerHTML = archived.length ? archived.map((b) =>
      '<div class="arow"><span>' + esc(b.title) + ' <span class="c">' + doneCount(b, s) + '/' + total + '</span></span>' +
      '<span class="acts"><button type="button" class="btn sm" data-act="restore" data-id="' + b.id + '">되살리기</button>' +
      '<button type="button" class="btn sm danger" data-act="delete" data-id="' + b.id + '">지우기</button></span></div>'
    ).join('') : '<p class="none">보관한 판이 없어요.</p>';
    renderDetail(s, meta);
  }

  /* --- 선택한 판의 자세한 모습 --- */
  function renderDetail(s, meta) {
    const b = s.boards.find((x) => x.id === sel && !x.archived);
    if (!b) { if (!titleEditing) detailEl.innerHTML = '<p class="none">판 목록에서 판을 고르거나 새로 만들어 주세요.</p>'; return; }
    const head = detailEl.querySelector('.dt-title');
    if (!(titleEditing && head && head.dataset.id === b.id)) {
      detailEl.innerHTML = '<input class="dt-title" data-id="' + b.id + '" maxlength="40" aria-label="판 이름, 눌러서 고칠 수 있어요"><div class="dt-body"></div>';
      detailEl.querySelector('.dt-title').value = b.title;
    }
    const body = detailEl.querySelector('.dt-body');
    const total = s.students.length;
    const todo = s.students.filter((x) => !b.done[x.id]);
    const done = s.students.filter((x) => b.done[x.id]);
    const on = s.show.includes(b.id);
    const chip = (x, d) => '<button type="button" class="chip' + (d ? ' d' : '') + '" data-act="' + (d ? 'unmark' : 'mark') + '" data-id="' + x.id + '"><b>' + x.no + '</b>' + esc(x.name) + '</button>';
    const metaText = !total ? '학생 명단이 비어 있어요' : todo.length ? done.length + '명 다 했어요, ' + todo.length + '명 남았어요' : '모두 다 했어요';
    keepFocus(body, () => {
      body.innerHTML =
        '<p class="dt-meta">' + metaText + (on ? ' (태블릿에 표시 중)' : '') + '</p>' +
        '<div class="dt-bar"><i style="width:' + pct(done.length, total) + '%"></i></div>' +
        '<div class="grp"><h3>아직 안 한 학생 <span class="count' + (todo.length ? ' todo' : '') + '">' + todo.length + '명</span></h3>' +
        '<div class="chips">' + (todo.map((x) => chip(x, false)).join('') || '<span class="none">모두 다 했어요!</span>') + '</div>' +
        '<p class="hint">이름을 누르면 다 한 것으로 바꿔요.</p></div>' +
        '<div class="grp"><h3>다 한 학생 <span class="count">' + done.length + '명</span></h3>' +
        '<div class="chips">' + (done.map((x) => chip(x, true)).join('') || '<span class="none">아직 아무도 없어요.</span>') + '</div>' +
        '<p class="hint">이름을 누르면 다시 ‘아직’으로 돌려요.</p></div>' +
        '<div class="dt-actions">' +
        '<button type="button" class="btn' + (on ? '' : ' primary') + '" data-act="show" data-id="' + b.id + '">' + (on ? '태블릿에서 숨기기' : '태블릿에 표시') + '</button>' +
        '<button type="button" class="btn" data-act="reset">처음부터 다시</button>' +
        '<button type="button" class="btn" data-act="archive">보관하기</button></div>';
    });
    if (meta && meta.by === 'tablet' && meta.bid === b.id) {
      const q = meta.type === 'done' ? '.chip.d' : meta.type === 'undo' ? '.chip:not(.d)' : '';
      const c = q ? body.querySelector(q + '[data-id="' + meta.sid + '"]') : null;
      if (c) c.classList.add(meta.type === 'done' ? 'new' : 'undo-new');
    }
  }

  /* --- 학생 명단 --- */
  function renderRoster(s) {
    $('#tv-rcount').textContent = s.students.length + '명';
    if (rosterEditing) { rosterPending = true; return; }
    rosterPending = false;
    const count = {};
    s.students.forEach((x) => { count[x.no] = (count[x.no] || 0) + 1; });
    tbody.innerHTML = s.students.length ? s.students.map((x) =>
      '<tr><td><input class="in in-no" type="number" min="1" max="99" inputmode="numeric" data-field="no" data-id="' + x.id + '" value="' + x.no + '" aria-label="' + esc(x.name) + '의 번호">' +
      (count[x.no] > 1 ? '<div class="dup">번호가 겹쳐요</div>' : '') + '</td>' +
      '<td><input class="in" maxlength="20" data-field="name" data-id="' + x.id + '" value="' + esc(x.name) + '" aria-label="' + x.no + '번 이름"></td>' +
      '<td><button type="button" class="btn sm danger" data-act="del-student" data-id="' + x.id + '">빼기</button></td></tr>'
    ).join('') : '<tr><td colspan="3" class="none">명단이 비어 있어요. 위에서 한 명씩 추가하거나 아래에서 한꺼번에 붙여넣어 주세요.</td></tr>';
  }

  /* --- 태블릿 설정 --- */
  function renderSettings(s) {
    const st = s.settings;
    root.querySelectorAll('[data-act="sound"]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === !!st.sound)));
    root.querySelectorAll('[data-act="self-cancel"]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === !!st.selfCancel)));
    root.querySelectorAll('[data-act="praise"]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === !!st.praise)));
    renderDevices(s);
  }

  /* --- 연결된 태블릿 --- */
  function renderDevices(s) {
    const devs = (s.devices || []).slice().sort((a, b) => (a.approved === b.approved ? (b.createdAt || 0) - (a.createdAt || 0) : (a.approved ? 1 : -1)));
    const pending = devs.filter((d) => !d.approved);
    const badge = $('#tv-badge');
    badge.textContent = pending.length;
    badge.hidden = !pending.length;
    const box = $('#tv-devices');
    keepFocus(box, () => {
      box.innerHTML = devs.length ? devs.map((d) =>
        '<div class="dev' + (d.approved ? '' : ' pending') + '"><span class="dev-code">' + esc(d.code || '----') + '</span>' +
        '<span class="dev-info">' + esc(d.agent || '기기') + ', ' + (d.approved ? '연결됨, 마지막 접속 ' + timeText(d.lastSeen) : '승인을 기다려요, ' + timeText(d.createdAt) + ' 요청') + '</span>' +
        '<span class="dev-acts">' + (d.approved
          ? '<button type="button" class="btn sm danger" data-act="remove-device" data-id="' + esc(d.id) + '">연결 끊기</button>'
          : '<button type="button" class="btn sm primary" data-act="approve" data-id="' + esc(d.id) + '">승인</button><button type="button" class="btn sm" data-act="remove-device" data-id="' + esc(d.id) + '">거절</button>') +
        '</span></div>'
      ).join('') : '<p class="none">아직 연결을 요청한 태블릿이 없어요.</p>';
    });
    const ids = new Set(pending.map((d) => d.id));
    if (knownPending) {
      const fresh = pending.find((d) => !knownPending.has(d.id));
      if (fresh) flash((fresh.code || '새') + '번 태블릿이 연결을 요청했어요. 태블릿 설정에서 승인해 주세요.');
    }
    knownPending = ids;
  }

  function render(s, meta) {
    renderBoards(s, meta); renderRoster(s); renderSettings(s);
    if (meta && meta.initial && !s.students.length) {
      setTab('roster');
      flash('먼저 학생 명단을 넣어 주세요. 엑셀에서 번호와 이름을 복사해 붙여넣을 수 있어요.');
    }
  }

  /* --- 동작 --- */
  function createBoard() {
    const inp = $('#tv-new-title');
    const title = inp.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    if (!title) { flash('새 판 이름을 적어 주세요.'); inp.focus(); return; }
    const show = $('#tv-autoshow').checked;
    pendingSel = store.addBoard(title, show);   /* 저장되어 목록에 나타나면 그 판을 고릅니다 */
    inp.value = '';
    flash(show ? '‘' + title + '’ 판을 만들어 태블릿에 표시했어요.' : '‘' + title + '’ 판을 만들었어요.');
  }
  function addOne() {
    const nameEl = $('#tv-add-name'), noEl = $('#tv-add-no');
    const name = nameEl.value.trim().replace(/\s+/g, ' ').slice(0, 20);
    if (!name) { nameEl.focus(); return; }
    const n = parseInt(noEl.value, 10);
    store.addStudents([{ no: n >= 1 && n <= 99 ? n : null, name }]);
    nameEl.value = '';
    noEl.value = '';
    nameEl.focus();
  }
  function savePin() {
    const inp = $('#tv-pin');
    const v = inp.value.trim();
    if (!/^\d{4}$/.test(v)) { note('#tv-pin-msg', '숫자 4자리로 적어 주세요.', true); return; }
    store.setSetting('pin', v);
    inp.value = '';
    note('#tv-pin-msg', '잠금번호를 바꿨어요.');
  }
  function moveNext(t) {
    const list = Array.from(root.querySelectorAll('.roster .in[data-field="' + t.dataset.field + '"]'));
    const nx = list[list.indexOf(t) + 1];
    if (nx) { nx.focus(); nx.select(); } else t.blur();
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t || !root.contains(t)) return;
    if (t.dataset.tab) { setTab(t.dataset.tab); return; }
    if (t.dataset.quick) { const inp = $('#tv-new-title'); inp.value = t.dataset.quick + ' '; inp.focus(); return; }
    const act = t.dataset.act;
    const id = t.dataset.id;
    const s = store.get();
    switch (act) {
      case 'new': createBoard(); break;
      case 'select': sel = id; renderBoards(s, {}); break;
      case 'show': store.toggleShow(id); break;
      case 'mark': if (sel) store.markDone(sel, id, 'teacher'); break;
      case 'unmark': if (sel) store.unmark(sel, id, 'teacher'); break;
      case 'reset':
        confirmBox('이 판의 완료 표시를 모두 지우고 처음부터 다시 할까요?', '모두 지우기').then((ok) => { if (ok && sel) store.resetBoard(sel); });
        break;
      case 'archive':
        if (sel) { store.archiveBoard(sel, true); flash('보관함으로 옮겼어요. 보관함에서 다시 되살릴 수 있어요.'); }
        break;
      case 'restore': store.archiveBoard(id, false); pendingSel = id; flash('판을 되살렸어요.'); break;
      case 'delete':
        confirmBox('이 판을 완전히 지울까요? 지운 판은 되살릴 수 없어요.', '지우기').then((ok) => { if (ok) store.deleteBoard(id); });
        break;
      case 'add-one': addOne(); break;
      case 'del-student': {
        const x = s.students.find((y) => y.id === id);
        if (!x) break;
        confirmBox(x.no + '번 ' + x.name + ' 학생을 명단에서 뺄까요? 모든 판에서 이 학생의 기록도 함께 지워져요.', '빼기').then((ok) => { if (ok) store.removeStudent(id); });
        break;
      }
      case 'renumber':
        confirmBox('지금 순서대로 번호를 1번부터 다시 매길까요?', '다시 매기기').then((ok) => { if (ok) store.renumber(); });
        break;
      case 'bulk-add': {
        const list = parseRoster($('#tv-bulk').value);
        if (!list.length) { note('#tv-bulk-msg', '붙여넣은 이름이 없어요.', true); break; }
        store.addStudents(list);
        $('#tv-bulk').value = '';
        $('#tv-bulk-preview').textContent = '';
        note('#tv-bulk-msg', list.length + '명을 추가했어요.');
        break;
      }
      case 'bulk-replace': {
        const list = parseRoster($('#tv-bulk').value);
        if (!list.length) { note('#tv-bulk-msg', '붙여넣은 이름이 없어요.', true); break; }
        confirmBox('지금 명단 ' + s.students.length + '명을 새 명단 ' + list.length + '명으로 바꿀까요? 모든 판의 완료 기록이 지워져요.', '명단 바꾸기').then((ok) => {
          if (!ok) return;
          store.replaceStudents(list);
          $('#tv-bulk').value = '';
          $('#tv-bulk-preview').textContent = '';
          note('#tv-bulk-msg', list.length + '명으로 명단을 바꿨어요.');
        });
        break;
      }
      case 'save-pin': savePin(); break;
      case 'sound': store.setSetting('sound', t.dataset.v === '1'); break;
      case 'self-cancel': store.setSetting('selfCancel', t.dataset.v === '1'); break;
      case 'praise': store.setSetting('praise', t.dataset.v === '1'); break;
      case 'approve': store.approveDevice(id); flash('태블릿을 승인했어요. 곧 그 태블릿에 판이 열려요.'); break;
      case 'remove-device': {
        const d = (s.devices || []).find((x) => x.id === id);
        const label = d && d.code ? d.code + '번 태블릿' : '이 태블릿';
        const on = !!(d && d.approved);
        confirmBox(on ? label + '의 연결을 끊을까요? 다시 쓰려면 새로 승인해야 해요.' : label + '의 요청을 거절할까요?', on ? '연결 끊기' : '거절').then((ok) => { if (ok) store.removeDevice(id); });
        break;
      }
      case 'reload-tablets': store.reloadTablets(); note('#tv-reload-msg', '연결된 태블릿에 새로고침을 보냈어요.'); break;
      case 'reload-self': location.reload(); break;
      case 'logout': ctx.logout(); break;
      default: break;
    }
  });

  root.addEventListener('keydown', (e) => {
    const t = e.target;
    if (composing(e)) return;
    if (t.id === 'tv-new-title' && e.key === 'Enter') { e.preventDefault(); createBoard(); }
    else if (t.id === 'tv-add-name' && e.key === 'Enter') { e.preventDefault(); addOne(); }
    else if (t.id === 'tv-pin' && e.key === 'Enter') { e.preventDefault(); savePin(); }
    else if (t.classList.contains('dt-title')) {
      if (e.key === 'Enter') { e.preventDefault(); t.blur(); }
      else if (e.key === 'Escape') { const b = store.get().boards.find((x) => x.id === t.dataset.id); if (b) t.value = b.title; t.blur(); }
    } else if (t.matches('.roster .in') && e.key === 'Enter') { e.preventDefault(); moveNext(t); }
  });

  root.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('.roster .in')) {
      const x = store.get().students.find((y) => y.id === t.dataset.id);
      if (!x) return;
      if (t.dataset.field === 'name') {
        const v = t.value.trim().replace(/\s+/g, ' ').slice(0, 20);
        if (!v) { t.value = x.name; return; }
        if (v !== x.name) store.updateStudent(x.id, { name: v });
      } else {
        const n = parseInt(t.value, 10);
        if (!(n >= 1 && n <= 99)) { t.value = x.no; return; }
        if (n !== x.no) store.updateStudent(x.id, { no: n });
      }
    } else if (t.classList.contains('dt-title')) {
      const b = store.get().boards.find((x) => x.id === t.dataset.id);
      if (!b) return;
      const v = t.value.trim().replace(/\s+/g, ' ').slice(0, 40);
      if (!v) { t.value = b.title; return; }
      if (v !== b.title) store.renameBoard(b.id, v);
    }
  });

  $('#tv-bulk').addEventListener('input', () => {
    const list = parseRoster($('#tv-bulk').value);
    $('#tv-bulk-preview').textContent = list.length
      ? list.length + '명을 알아봤어요: ' + list.slice(0, 6).map((x) => (x.no ? x.no + ' ' : '') + x.name).join(', ') + (list.length > 6 ? ' …' : '')
      : '';
  });

  /* 입력 중에는 목록을 다시 그리지 않고, 입력이 끝나면 한 번에 반영합니다 */
  tbody.addEventListener('focusin', () => { rosterEditing = true; });
  tbody.addEventListener('focusout', () => {
    setTimeout(() => {
      if (tbody.contains(document.activeElement)) return;
      rosterEditing = false;
      if (rosterPending) renderRoster(store.get());
    }, 0);
  });
  detailEl.addEventListener('focusin', (e) => { if (e.target.classList.contains('dt-title')) titleEditing = true; });
  detailEl.addEventListener('focusout', (e) => {
    if (!e.target.classList.contains('dt-title')) return;
    setTimeout(() => {
      const a = document.activeElement;
      if (a && a.classList && a.classList.contains('dt-title')) return;
      titleEditing = false;
      renderDetail(store.get(), {});
    }, 0);
  });

  $('#tv-email').textContent = ctx.email || '';
  store.subscribe(render);
  setInterval(() => { const s = store.get(); if (s) renderDevices(s); }, 60000);   /* '몇 분 전' 표시를 새로 고칩니다 */
  return {
    flash,
    setNet(on) {
      const el = $('#tv-net');
      el.textContent = on ? '실시간 연결됨' : '연결 끊김, 다시 연결되면 저장돼요';
      el.classList.toggle('on', !!on);
    },
    showUpdate() { $('#tv-update').hidden = false; }
  };
}


/* ======================================================
   시작: 주소에 ?teacher 가 있으면 교사 화면, 없으면 태블릿 화면
   ====================================================== */
const appRoot = document.getElementById('app');
document.body.classList.add(MODE === 'teacher' ? 'mode-teacher' : 'mode-board');

function authReady() {
  return new Promise((resolve) => { const un = onAuthStateChanged(auth, (u) => { un(); resolve(u); }); });
}
function watchNet(cb) {
  const f = () => cb(navigator.onLine !== false);
  window.addEventListener('online', f);
  window.addEventListener('offline', f);
  f();
}
/* 새 화면 파일이 올라왔는지 몇 분마다 확인합니다 */
function startVersionWatch(onNew) {
  let told = false;
  async function check() {
    if (told || document.visibilityState === 'hidden') return false;
    try {
      const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return false;
      const m = (await res.text()).match(/APP_VERSION = '(\d{4}-\d{2}-\d{2}-\d+)'/);
      if (m && m[1] !== APP_VERSION) { told = true; onNew(m[1]); return true; }
    } catch (e) { /* 인터넷이 끊겼으면 다음에 다시 봅니다 */ }
    return false;
  }
  setTimeout(check, 2 * 60 * 1000);
  setInterval(check, 10 * 60 * 1000);
  return check;
}
window.__dhs = { version: APP_VERSION };   /* 점검용 */

/* ---------------- 교사 화면 ---------------- */
async function bootTeacher() {
  document.title = '다했어요판 교사 화면';
  const page = document.createElement('div');
  page.className = 'teacher-page';
  appRoot.replaceChildren(page);
  const screen = (html) => { page.innerHTML = '<div class="screen"><div class="card-box">' + html + '</div></div>'; };
  let view = null, store = null, netOn = true;

  function loginScreen(msg) {
    screen('<h1>다했어요판 교사 화면</h1><p>' + esc(msg || '선생님 구글 계정으로 로그인해 주세요.') + '</p>' +
      '<button type="button" class="btn primary" id="login">구글 계정으로 로그인</button>' +
      '<p class="fine">태블릿에서는 이 주소에서 ?teacher 를 뺀 주소를 열어요.</p>');
    page.querySelector('#login').addEventListener('click', async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); open(); }
      catch (err) { loginScreen(describeError(err)); }
    });
  }
  async function logout() {
    if (store) store.stop();
    store = null; view = null;
    await signOut(auth);
    loginScreen('로그아웃했어요.');
  }
  async function open() {
    const u = auth.currentUser;
    if (!u || u.isAnonymous) { loginScreen(); return; }
    screen('<div class="spinner"></div><p>기록장을 여는 중이에요…</p>');
    try {
      /* 처음 쓰는 기록장이면 기본 설정과 빈 명단을 만들어 둡니다 */
      const s = await getDoc(R.settings());
      if (!s.exists()) await setDoc(R.settings(), DEFAULT_SETTINGS);
      const r = await getDoc(R.roster());
      if (!r.exists()) await setDoc(R.roster(), { items: [], updatedAt: Date.now() });
    } catch (err) {
      if (err && err.code === 'permission-denied') {
        screen('<h1>선생님 계정이 아니에요</h1><p>' + esc(u.email || '이 계정') + '은(는) 다했어요판 선생님 계정으로 등록되어 있지 않아요. 등록한 구글 계정으로 다시 로그인해 주세요.</p>' +
          '<button type="button" class="btn primary" id="relogin">다른 계정으로 로그인</button>');
        page.querySelector('#relogin').addEventListener('click', async () => { await signOut(auth); loginScreen(); });
      } else {
        screen('<h1>기록장을 열지 못했어요</h1><p>' + esc(describeError(err)) + '</p><button type="button" class="btn primary" id="retry">다시 시도</button>');
        page.querySelector('#retry').addEventListener('click', open);
      }
      return;
    }
    store = createCloudStore('teacher', {
      onListenError: (err) => { if (view) view.flash('기록을 불러오지 못했어요. ' + describeError(err)); },
      onWriteError: (err) => { if (view) view.flash('저장하지 못했어요. ' + describeError(err)); }
    });
    await store.start();
    page.innerHTML = '<div class="tv" id="teacher"></div>';
    view = TeacherView(page.querySelector('#teacher'), store, { email: u.email, logout });
    view.setNet(netOn);
  }

  watchNet((on) => { netOn = on; if (view) view.setNet(on); });
  window.__dhs.checkVersion = startVersionWatch(() => { if (view) view.showUpdate(); });
  screen('<div class="spinner"></div><p>연결하는 중이에요…</p>');
  await authReady();
  open();
}

/* ---------------- 태블릿 화면 ---------------- */
async function bootBoard() {
  let view = null, store = null, deviceCode = '', unsubDevice = null, beat = null;
  let netOn = true, pendingUpdate = false, lastTouch = Date.now();
  const unitOf = (el) => { const w = el.clientWidth, h = el.clientHeight; if (w && h) el.style.setProperty('--u', (Math.min(w, h * 1.4) / 100).toFixed(2) + 'px'); };

  function shell(html) {
    stopBoard();
    const el = document.createElement('div');
    el.className = 'board';
    el.innerHTML = html;
    appRoot.replaceChildren(el);
    unitOf(el);
  }
  window.addEventListener('resize', () => { const el = appRoot.firstElementChild; if (el && !view) unitOf(el); });
  const waitHTML = (label, big, help, small) => '<div class="wait"><div class="wait-label">' + label + '</div>' +
    (big ? '<div class="wait-code">' + esc(big) + '</div>' : '') +
    (help ? '<div class="wait-help">' + help + '</div>' : '') + (small ? '<div class="wait-small">' + small + '</div>' : '') + '</div>';
  const showWaiting = (code) => shell(waitHTML('이 태블릿의 번호', code,
    '선생님 PC의 교사 화면에서 <b>태블릿 설정</b>을 열고 이 번호를 승인해 주세요.', '승인되면 다했어요판이 저절로 열려요.'));
  const showError = (err) => {
    shell(waitHTML('연결하지 못했어요', '', esc(describeError(err)), '30초 뒤에 저절로 다시 시도해요.'));
    setTimeout(() => location.reload(), 30000);
  };

  function stopBoard() {
    if (view) { view.destroy(); view = null; }
    if (store) { store.stop(); store = null; }
    if (beat) { clearInterval(beat); beat = null; }
  }

  async function startBoard(isTeacherUser) {
    if (view || store) return;
    const s = createCloudStore('board', {
      onListenError: (err) => {
        if (err && err.code === 'permission-denied') {
          if (isTeacherUser) showOtherAccount();   /* 승인 취소는 기기 문서 감시에서 따로 처리합니다 */
        } else if (view) view.say('기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
      },
      onWriteError: () => { if (view) view.say('기록하지 못했어요. 선생님께 말해요.'); }
    });
    store = s;
    await s.start();
    if (store !== s) return;   /* 기다리는 사이 승인이 취소된 경우 */
    const el = document.createElement('div');
    el.className = 'board';
    appRoot.replaceChildren(el);
    view = BoardView(el, s, { deviceText: () => (isTeacherUser ? '선생님 계정으로 열려 있어요' : '번호 ' + deviceCode + ', 승인됨') });
    view.setNet(netOn ? '' : '인터넷 연결이 끊겼어요. 누른 기록은 연결되면 보내져요.');
    /* 선생님이 '태블릿 새로고침'을 누르면 다시 불러옵니다 */
    let base = null;
    s.subscribe((st) => {
      const seq = Number(st.settings.reloadSeq) || 0;
      if (base === null) base = seq;
      else if (seq > base) location.reload();
    });
  }

  function showOtherAccount() {
    shell(waitHTML('이 기기는 다른 구글 계정으로 로그인되어 있어요', '', '태블릿으로 쓰려면 아래 단추를 눌러 주세요.',
      '<button type="button" class="pill" id="as-tablet" style="margin-top:8px">이 기기를 태블릿으로 쓰기</button>'));
    const btn = document.getElementById('as-tablet');
    if (btn) btn.addEventListener('click', async () => { await signOut(auth); location.reload(); });
  }

  function watchDevice(uid) {
    const ref = R.device(uid);
    unsubDevice = onSnapshot(ref, async (snap) => {
      if (!snap.exists()) {
        if (snap.metadata.fromCache) { if (!view) shell(waitHTML('연결하는 중이에요…')); return; }
        stopBoard();
        deviceCode = String(1000 + Math.floor(Math.random() * 9000));
        showWaiting(deviceCode);
        try { await setDoc(ref, { code: deviceCode, approved: false, createdAt: Date.now(), lastSeen: Date.now(), agent: deviceKind() }); }
        catch (err) { showError(err); }
        return;
      }
      const d = snap.data();
      deviceCode = d.code || deviceCode;
      if (!d.approved) { if (view || store || !document.querySelector('.wait-code')) showWaiting(deviceCode); return; }
      if (!view && !store) {
        await startBoard(false);
        const ping = () => { if (document.visibilityState !== 'hidden') updateDoc(ref, { lastSeen: Date.now() }).catch(() => {}); };
        ping();
        if (beat) clearInterval(beat);
        beat = setInterval(ping, 10 * 60 * 1000);
      }
    }, (err) => showError(err));
  }

  /* 새 버전은 아무도 누르지 않을 때 다시 불러옵니다 */
  document.addEventListener('pointerdown', () => { lastTouch = Date.now(); }, true);
  function tryUpdate() {
    if (!pendingUpdate) return;
    if (Date.now() - lastTouch > 60000 && !(view && view.menuOpen())) location.reload();
    else setTimeout(tryUpdate, 20000);
  }
  window.__dhs.checkVersion = startVersionWatch(() => { pendingUpdate = true; tryUpdate(); });
  window.__dhs.forceIdle = () => { lastTouch = 0; tryUpdate(); };
  watchNet((on) => { netOn = on; if (view) view.setNet(on ? '' : '인터넷 연결이 끊겼어요. 누른 기록은 연결되면 보내져요.'); });

  shell(waitHTML('연결하는 중이에요…'));
  let user = await authReady();
  if (!user) {
    try { user = (await signInAnonymously(auth)).user; }
    catch (err) { showError(err); return; }
  }
  if (user.isAnonymous) watchDevice(user.uid);
  else startBoard(true);   /* 선생님 계정으로 로그인된 PC에서는 승인 없이 바로 엽니다 */
}

if (MODE === 'teacher') bootTeacher(); else bootBoard();
</script>

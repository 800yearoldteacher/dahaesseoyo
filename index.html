<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B5747">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다했어요판">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>다했어요판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
:root{
  --page:#EDF1EE;--panel:#FFFFFF;--panel-2:#F4F7F5;--line:#D3DCD7;--line-2:#B6C4BD;
  --text:#15201C;--text-2:#4A5A54;--text-3:#6B7A74;
  --accent:#2B5747;--accent-ink:#FFFFFF;
  --board:#2B5747;--board-deep:#1E3F33;--bezel:#16211D;
  --chalk:#F1F4EE;--chalk-2:rgba(241,244,238,.74);--chalk-3:rgba(241,244,238,.3);
  --tag:#FFFFFF;--tag-ink:#1C2925;--tag-2:#5A6A64;
  --done:#FFD43B;--done-ink:#3A2C00;--done-soft:#FFF1BF;--done-soft-ink:#5A4300;
  --stamp:#D62839;--danger:#B3261E;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --font-board:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#101714;--panel:#18221E;--panel-2:#1E2A25;--line:#2D3B35;--line-2:#3E5048;
    --text:#E6EDE9;--text-2:#A8B7B0;--text-3:#86968F;
    --accent:#8FC9B0;--accent-ink:#0D1A14;
    --board:#24493C;--board-deep:#183329;--bezel:#060908;
    --tag:#F3F5F1;--done:#F4C93A;--done-soft:#3B3318;--done-soft-ink:#F6DD8C;
    --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#101714;--panel:#18221E;--panel-2:#1E2A25;--line:#2D3B35;--line-2:#3E5048;
  --text:#E6EDE9;--text-2:#A8B7B0;--text-3:#86968F;
  --accent:#8FC9B0;--accent-ink:#0D1A14;
  --board:#24493C;--board-deep:#183329;--bezel:#060908;
  --tag:#F3F5F1;--done:#F4C93A;--done-soft:#3B3318;--done-soft-ink:#F6DD8C;
  --danger:#FF8A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* 학생용 판 */
.board{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--board);color:var(--chalk);overflow:hidden;font-family:var(--font-board);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.board-top{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:46px;padding:8px 12px 0 20px;color:var(--chalk-2);font-size:clamp(13px,calc(var(--u,8px) * 1.7),19px)}
.date{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-dots{display:flex;align-items:center;gap:9px}
.page-dots i{width:11px;height:11px;border-radius:50%;background:var(--chalk-3)}
.page-dots i.on{background:var(--done)}
.gear{justify-self:end;width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:var(--chalk-3);display:grid;place-items:center;touch-action:manipulation}
.gear:hover{color:var(--chalk-2)}
.gear svg{width:22px;height:22px}
.cols{flex:1;min-height:0;display:flex;gap:18px;padding:4px 20px 14px}
.col{position:relative;flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column}
.col+.col{border-left:2px dashed var(--chalk-3);padding-left:18px}
@supports (grid-template-rows:subgrid){
  .cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0 18px}
  .col{display:grid;grid-row:1 / span 2;grid-template-rows:subgrid;row-gap:0}
  .col-head{align-self:end}
}
.col-head{flex:none;margin-bottom:12px;text-align:center}
.col-title{margin:0;font-weight:400;font-size:var(--title-size,36px);line-height:1.15;color:var(--chalk);word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.col-meta{display:flex;align-items:center;gap:12px;margin-top:8px}
.col-count{flex:none;font-size:var(--count-size,20px);line-height:1.1;color:var(--chalk-2);white-space:nowrap}
.col-count b{font-weight:400;color:var(--done)}
.col-bar{flex:1;height:6px;border-radius:3px;background:var(--chalk-3);overflow:hidden}
.col-bar i{display:block;height:100%;width:0;background:var(--done);border-radius:3px;transition:width .35s ease}
.grid{flex:1;min-height:0;display:grid;gap:var(--gap,10px);grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));grid-auto-rows:var(--card-h,90px);align-content:center}
.card{position:relative;border:0;border-radius:12px;background:var(--tag);color:var(--tag-ink);font-family:var(--font-board);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 0 var(--board-deep);transition:background-color .18s ease,transform .08s ease,box-shadow .08s ease}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--board-deep)}
.card:focus-visible{outline:3px solid var(--done);outline-offset:3px}
.card .no{font-size:var(--no-size,36px);line-height:1}
.card .nm{margin-top:.2em;max-width:100%;font-size:var(--nm-size,18px);line-height:1.1;color:var(--tag-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.done{background:var(--done);color:var(--done-ink)}
.card.done .nm{color:var(--done-ink)}
.stamp{position:absolute;top:4%;right:3%;width:var(--stamp-size,44px);height:var(--stamp-size,44px);border-radius:50%;border:max(2px,calc(var(--stamp-size,44px)*.06)) solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--stamp-size,44px)*.28);line-height:1.02;transform:rotate(-14deg);opacity:0;mix-blend-mode:multiply;pointer-events:none}
.stamp::after{content:"";position:absolute;inset:max(2px,calc(var(--stamp-size,44px)*.07));border:max(1px,calc(var(--stamp-size,44px)*.03)) solid var(--stamp);border-radius:50%}
.card.done .stamp{opacity:.9}
.card.pop .stamp{animation:stampIn .36s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes stampIn{0%{opacity:0;transform:rotate(-34deg) scale(1.9)}62%{opacity:.95;transform:rotate(-11deg) scale(.9)}100%{opacity:.9;transform:rotate(-14deg) scale(1)}}
.big-stamp{position:absolute;left:50%;top:55%;width:var(--big,220px);height:var(--big,220px);border-radius:50%;border:max(4px,calc(var(--big,220px)*.028)) solid var(--stamp);background:rgba(255,255,255,.94);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.08;transform:translate(-50%,-50%) rotate(-12deg);opacity:0;pointer-events:none}
.big-stamp::after{content:"";position:absolute;inset:calc(var(--big,220px)*.045);border:max(2px,calc(var(--big,220px)*.01)) solid var(--stamp);border-radius:50%}
.big-stamp .l1{font-size:calc(var(--big,220px)*.22)}
.big-stamp .l2{font-size:calc(var(--big,220px)*.13);white-space:nowrap}
.big-stamp.show{animation:bigIn .5s cubic-bezier(.2,.9,.3,1.2) both,fadeOut .5s ease 2.6s forwards}
@keyframes bigIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-36deg) scale(1.8)}65%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(.94)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
@keyframes fadeOut{to{opacity:0}}
.tray{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;min-height:clamp(56px,9%,72px);padding:8px 12px;background:var(--board-deep);border-top:4px solid rgba(0,0,0,.14);color:var(--chalk);font-size:clamp(15px,calc(var(--u,8px) * 2.7),26px)}
.tray-msg{grid-column:2;min-width:0;text-align:center;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.nav{display:inline-flex;align-items:center;gap:4px;min-height:52px;padding:0 18px;border:2px solid var(--chalk-2);border-radius:999px;background:rgba(255,255,255,.06);color:var(--chalk);font-family:var(--font-board);font-size:.92em;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.nav:active{background:rgba(255,255,255,.2)}
.nav svg{flex:none;width:1.05em;height:1.05em}
.nav[hidden]{display:none}
.nav.prev{grid-column:1}
.nav.next{grid-column:3}
.cols.turn{animation:turnIn .2s ease}
@keyframes turnIn{from{opacity:.2}to{opacity:1}}
.tray-msg.idle{color:var(--chalk-2)}
.tray-msg .sub{display:block;margin-top:.12em;font-size:.72em;opacity:.85}
.empty{flex:1;grid-column:1 / -1;grid-row:1 / -1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--chalk-2);font-size:clamp(17px,calc(var(--u,8px) * 2.6),30px);line-height:1.5}

.sheet{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,18,14,.58)}
.sheet.open{display:flex}
.sheet-box{width:min(360px,100%);max-height:100%;overflow:auto;padding:18px 18px 16px;border-radius:18px;background:var(--board-deep);color:var(--chalk);text-align:center;box-shadow:0 0 0 2px var(--chalk-3)}
.sheet-box h3{margin:0 0 4px;font-weight:400;font-size:22px}
.sheet-box>p{margin:0 0 12px;color:var(--chalk-2);font-size:15px}
.dots{display:flex;justify-content:center;gap:12px;margin:6px 0 14px}
.dots span{width:16px;height:16px;border:2px solid var(--chalk-2);border-radius:50%}
.dots span.on{background:var(--chalk);border-color:var(--chalk)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:56px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:var(--chalk);font-family:var(--font-board);font-size:24px;touch-action:manipulation}
.keys button:active{background:rgba(255,255,255,.2)}
.keys .k-sub{font-size:17px;color:var(--chalk-2)}
.menu-list{display:grid;gap:8px;text-align:left}
.menu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:17px}
.menu-row small{display:block;margin-top:2px;color:var(--chalk-2);font-size:13px;line-height:1.35}
.pill{flex:none;min-width:72px;border:2px solid var(--chalk-2);border-radius:999px;background:transparent;color:var(--chalk);padding:4px 14px;font-family:var(--font-board);font-size:16px}
.pill[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.sheet-close{width:100%;height:48px;margin-top:12px;border:0;border-radius:12px;background:var(--chalk);color:var(--board-deep);font-family:var(--font-board);font-size:18px}

/* 교사 화면 */
.tv{container-type:inline-size;color:var(--text)}
.tv-inner{max-width:1180px;margin:0 auto;padding:16px 18px 28px}
.tv-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.tv-head h1{margin:0;font-size:20px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--text-2);font-size:12.5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#E0A21B}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{margin-bottom:-1px;padding:10px 12px 9px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--text-2);font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.flash{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--done-soft);color:var(--done-soft-ink);font-size:14px}
.boards-layout{display:grid;gap:16px}
.detail{order:-1}
@container (min-width:760px){
  .boards-layout{grid-template-columns:minmax(260px,320px) minmax(0,1fr);align-items:start}
  .detail{order:0}
}
.newb{display:flex;gap:8px}
.input{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn{height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 10px;border-radius:8px;font-size:13px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.quick button{padding:3px 10px;border:1px dashed var(--line-2);border-radius:999px;background:transparent;color:var(--text-2);font-size:13px}
.quick button:hover{border-style:solid;color:var(--text)}
.check{display:flex;align-items:center;gap:6px;margin:8px 0 14px;color:var(--text-2);font-size:13.5px}
.list-h{margin:0 0 6px;color:var(--text-2);font-size:13px;font-weight:500}
.blist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.bitem{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.bitem.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bsel{display:block;width:100%;padding:10px 12px 8px;border:0;background:transparent;text-align:left}
.bsel .t{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.bsel .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{display:block;height:5px;margin-top:7px;overflow:hidden;border-radius:3px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.mini i{display:block;height:100%;background:var(--done)}
.bfoot{display:flex;justify-content:flex-end;padding:0 10px 10px}
.showbtn{padding:3px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel);color:var(--text-2);font-size:12.5px}
.showbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.archive{margin-top:14px}
.archive summary{cursor:pointer;color:var(--text-2);font-size:13.5px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.arow .acts{display:flex;gap:6px}
.detail{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.dt-title{display:block;width:calc(100% + 12px);margin:0 0 0 -7px;padding:2px 6px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:22px;font-weight:600}
.dt-title:hover{border-color:var(--line)}
.dt-title:focus{border-color:var(--accent);outline:none;background:var(--panel-2)}
.dt-meta{margin:4px 0 8px;color:var(--text-2);font-size:14px}
.dt-bar{height:8px;margin-bottom:16px;overflow:hidden;border-radius:4px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.dt-bar i{display:block;height:100%;background:var(--done);transition:width .3s ease}
.grp h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px;font-weight:600}
.grp+.grp{margin-top:18px}
.count{padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--text-2);font-size:12.5px;font-weight:600}
.count.todo{border-color:var(--stamp);background:transparent;color:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);font-size:14px}
.chip b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent)}
.chip.d{border-color:transparent;background:var(--done-soft);color:var(--done-soft-ink)}
.chip.d b{color:inherit}
.chip.new{animation:chipIn 1.2s ease}
@keyframes chipIn{0%{box-shadow:0 0 0 4px var(--done)}100%{box-shadow:0 0 0 0 transparent}}
.chip.undo-new{animation:chipOut 1.4s ease}
@keyframes chipOut{0%{box-shadow:0 0 0 4px rgba(214,40,57,.45)}100%{box-shadow:0 0 0 0 transparent}}
.hint{margin:6px 0 0;color:var(--text-3);font-size:12.5px}
.none{color:var(--text-3);font-size:14px}
.dt-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.lead{margin:0 0 12px;color:var(--text-2);font-size:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.addrow{margin-top:0}
.addrow .no-in{flex:0 0 84px}
.roster{width:100%;margin-top:12px;border-collapse:collapse}
.roster th{padding:6px;border-bottom:1px solid var(--line);color:var(--text-2);font-size:12.5px;font-weight:500;text-align:left}
.roster td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.roster .in{width:100%;height:34px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent}
.roster .in:hover{border-color:var(--line)}
.roster .in:focus{border-color:var(--accent);outline:none;background:var(--panel-2)}
.roster .in-no{width:72px;font-variant-numeric:tabular-nums}
.roster td:last-child{width:1%;text-align:right}
.dup{color:var(--danger);font-size:12px}
.bulk{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.bulk summary{cursor:pointer;font-weight:500}
.bulk textarea{width:100%;min-height:140px;margin-top:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);line-height:1.5;resize:vertical}
.msg{color:var(--text-2);font-size:13px}
.msg.err{color:var(--danger)}
.set{padding:14px 0;border-bottom:1px solid var(--line)}
.set.last{border-bottom:0}
.set h3{margin:0 0 2px;font-size:15px;font-weight:600}
.set p{margin:0 0 10px;color:var(--text-2);font-size:13.5px}
.set.muted h3,.set.muted p{color:var(--text-3)}
.pinrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pin-in{flex:0 0 140px;letter-spacing:.3em;text-align:center}
.pin-in::placeholder{letter-spacing:normal}
.opts{display:inline-flex;overflow:hidden;border:1px solid var(--line-2);border-radius:10px}
.opts button{padding:7px 14px;border:0;border-right:1px solid var(--line-2);background:var(--panel);font-size:14px}
.opts button:last-child{border-right:0}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}

.dlg-back{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(10,18,15,.45)}

<script type="module">

const APP_VERSION = '2026-09-22-1';   /* 파일을 고칠 때마다 이 번호를 바꾸면 태블릿이 새 버전을 알아챕니다 */

const HEADER_WORDS = new Set(['이름', '성명', '학생', '학생명', '번호']);
const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>';

const rid = (p) => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const doneCount = (b, s) => s.students.reduce((n, x) => n + (b.done[x.id] ? 1 : 0), 0);
const composing = (e) => e.isComposing || e.keyCode === 229;

function deviceKind() {
  const ua = navigator.userAgent || '';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return '아이패드';
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? '안드로이드 휴대폰' : '안드로이드 태블릿';
  if (/iPhone/.test(ua)) return '아이폰';

  if (/Windows/.test(ua)) return '윈도우 PC';
